<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: uma folha de estudo centrada; resumo com marcador fluorescente, perguntas como folha de respostas A–D. */
:root {
  --paper: #f3f5f9;
  --sheet: #ffffff;
  --ink: #18202e;
  --ink-soft: #5a6478;
  --rule: #dfe3ec;
  --accent: #2443c9;
  --accent-ink: #ffffff;
  --marker: rgba(255, 221, 51, .55);
  --good: #13824a;
  --good-bg: #e3f4ea;
  --bad: #c42b2b;
  --bad-bg: #fbe6e6;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f131b; --sheet: #171c27; --ink: #e4e8f0; --ink-soft: #9aa3b5; --rule: #2a3142;
    --accent: #8fa3ff; --accent-ink: #0f131b; --marker: rgba(255, 214, 51, .22);
    --good: #5fd497; --good-bg: #133222; --bad: #ff8a8a; --bad-bg: #3a1a1d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f131b; --sheet: #171c27; --ink: #e4e8f0; --ink-soft: #9aa3b5; --rule: #2a3142;
  --accent: #8fa3ff; --accent-ink: #0f131b; --marker: rgba(255, 214, 51, .22);
  --good: #5fd497; --good-bg: #133222; --bad: #ff8a8a; --bad-bg: #3a1a1d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
#app { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
form { display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 700; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); font-family: var(--font-mono); font-weight: 500; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.mono { font-family: var(--font-mono); font-size: .85rem; font-variant-numeric: tabular-nums; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; background: none; border: 0; color: var(--ink); cursor: pointer; padding: 0; }
.brand span { color: var(--accent); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 24px clamp(16px, 4vw, 32px); display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.btn {
  font: 500 .95rem var(--font-display); padding: 10px 18px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, .opt input:focus-visible + .bubble, .drop:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.split { justify-content: space-between; }

/* Envio */
.drop {
  border: 2px dashed var(--rule); border-radius: 6px; padding: 28px 16px; text-align: center; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; align-items: center;
}
.drop.over, .drop:hover { border-color: var(--accent); }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.drop strong { font-family: var(--font-display); font-size: 1.1rem; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps div { border-top: 3px solid var(--accent); padding-top: 8px; font-size: .95rem; }
.steps b { display: block; font-family: var(--font-display); }
@media (max-width: 560px) { .steps { grid-template-columns: 1fr; } }
.mode { display: flex; flex-direction: column; gap: 6px; font-size: .95rem; }
.mode label { display: flex; gap: 8px; align-items: flex-start; }
.mode input { margin-top: 6px; }
.notice { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--paper); font-size: .95rem; }
.notice.error { border-color: var(--bad); }

/* Progresso */
.log { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.log li { display: flex; gap: 10px; }
.log .st { width: 1.2em; flex: none; text-align: center; }
.log .done .st { color: var(--good); }
.log .err .st { color: var(--bad); }
.log .run .st { animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .3; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .log .run .st { animation: none; } }

/* Índice */
.toc { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.toc li { border-top: 1px solid var(--rule); }
.toc li:last-child { border-bottom: 1px solid var(--rule); }
.toc button {
  width: 100%; display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
  background: none; border: 0; color: var(--ink); text-align: left; padding: 12px 4px; cursor: pointer; font: inherit;
}
.toc button:hover .t { color: var(--accent); }
.toc .n { font-family: var(--font-mono); color: var(--ink-soft); font-size: .85rem; }
.toc .t { font-family: var(--font-display); font-weight: 500; }
.pill { font-family: var(--font-mono); font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: var(--paper); border: 1px solid var(--rule); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

/* Secção */
.bar { height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar div { height: 100%; background: var(--accent); }
.summary p + p { margin-top: .8em; }
.keys { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.keys li span { background: linear-gradient(transparent 55%, var(--marker) 55%); padding: 0 2px; }

/* Perguntas */
.q { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.q legend { font-weight: 600; padding: 0; margin-bottom: 6px; display: flex; gap: 8px; }
.q legend .mono { color: var(--ink-soft); padding-top: 3px; }
fieldset.q + fieldset.q { border-top: 1px solid var(--rule); padding-top: 20px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.opt:hover { background: var(--paper); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.bubble {
  flex: none; width: 1.8em; height: 1.8em; border-radius: 50%; border: 1.5px solid var(--ink-soft);
  display: grid; place-items: center; font: 500 .8rem var(--font-mono); margin-top: 1px;
}
.opt input:checked + .bubble { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.opt.correct { background: var(--good-bg); }
.opt.correct .bubble { border-color: var(--good); color: var(--good); }
.opt.correct input:checked + .bubble { background: var(--good); color: var(--sheet); }
.opt.wrong { background: var(--bad-bg); }
.opt.wrong input:checked + .bubble { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.graded .opt { cursor: default; }
.why { font-size: .95rem; padding-left: 8px; }
.why b.ok { color: var(--good); }
.why b.no { color: var(--bad); }
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .big { font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
textarea { width: 100%; background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; font-size: .8rem; }
.tag { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
</style>

<div class="wrap">
  <header class="top">
    <button class="brand" id="home-btn" type="button">Speed<span>Learning</span></button>
    <span class="muted mono" id="doc-name"></span>
  </header>
  <main id="app"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
"use strict";
const QUESTIONS_PER_SECTION = 3;
const FINAL_TEST_SIZE = 10;
const TARGET_SECTION_CHARS = 3500;
const MAX_SECTIONS = 12;
const BATCH_CHARS = 60000;      // texto por pedido ao Claude
const MAX_SECTION_CHARS = 150000;
const STORE_KEY = "speedlearning:course";

const app = document.getElementById("app");
let sample = null;          // capacidade "sample" (Claude na conta de quem vê)
let course = null;          // curso atual
let results = {};           // {"0": {answers:[...], correct, total}, "final": ...}
let running = null;         // AbortController da geração

(window.claude?.use?.("sample") ?? Promise.resolve(null))
  .then(s => { sample = s; if (s && view === "home") renderHome(); })
  .catch(() => {});

// ---------------------------------------------------------------------------
// Exemplo para a primeira visita (marcado como exemplo)
// ---------------------------------------------------------------------------
const EXAMPLE = {
  title: "Energia nas células (exemplo)",
  filename: "exemplo-biologia.pdf",
  generator: "exemplo",
  sections: [
    {
      title: "A fotossíntese",
      summary: "A fotossíntese é o processo pelo qual as plantas, algas e algumas bactérias convertem energia luminosa em energia química. Ocorre nos cloroplastos, onde a clorofila absorve sobretudo luz vermelha e azul.\nA planta consome dióxido de carbono e água e produz glicose, libertando oxigénio como subproduto. A glicose é depois usada como fonte de energia ou armazenada como amido.",
      key_points: ["Converte energia luminosa em energia química", "Ocorre nos cloroplastos, graças à clorofila", "Entradas: CO₂ e água; saídas: glicose e O₂"],
      questions: [
        { question: "Em que organelo ocorre a fotossíntese?", options: ["Mitocôndria", "Cloroplasto", "Ribossoma", "Núcleo"], answer: 1, explanation: "A fotossíntese ocorre nos cloroplastos, que contêm clorofila." },
        { question: "Qual gás é libertado durante a fotossíntese?", options: ["Dióxido de carbono", "Azoto", "Oxigénio", "Metano"], answer: 2, explanation: "O oxigénio é libertado como subproduto da decomposição da água." },
        { question: "Porque é que as folhas parecem verdes?", options: ["A clorofila reflete a luz verde", "A clorofila absorve a luz verde", "A glicose é verde", "Os cloroplastos emitem luz verde"], answer: 0, explanation: "A clorofila absorve luz vermelha e azul e reflete a verde." }
      ]
    },
    {
      title: "A respiração celular",
      summary: "A respiração celular decorre nas mitocôndrias de quase todas as células. A glicose é degradada na presença de oxigénio para produzir ATP, a principal molécula de energia da célula.\nComo resíduos, a respiração liberta dióxido de carbono e água. Por isso as mitocôndrias são chamadas as centrais energéticas da célula.",
      key_points: ["Ocorre nas mitocôndrias", "Glicose + oxigénio → ATP", "Liberta CO₂ e água"],
      questions: [
        { question: "Qual é o principal produto energético da respiração celular?", options: ["Glicose", "Amido", "ATP", "Clorofila"], answer: 2, explanation: "A respiração produz ATP, usado pela célula como fonte de energia." },
        { question: "Onde decorre a respiração celular?", options: ["Nas mitocôndrias", "Nos cloroplastos", "Na parede celular", "No vacúolo"], answer: 0, explanation: "As mitocôndrias são o local da respiração celular." },
        { question: "Que substâncias são libertadas como resíduos?", options: ["Oxigénio e glicose", "Dióxido de carbono e água", "ATP e amido", "Azoto e água"], answer: 1, explanation: "A degradação da glicose liberta CO₂ e água." }
      ]
    }
  ],
  final_test: [
    { question: "Que relação existe entre fotossíntese e respiração celular?", options: ["São o mesmo processo", "Os produtos de uma são os reagentes da outra", "Ambas produzem oxigénio", "Ambas ocorrem só em animais"], answer: 1, explanation: "A fotossíntese produz glicose e O₂, que a respiração consome; a respiração liberta CO₂ e água, usados na fotossíntese." },
    { question: "Qual destes organismos realiza fotossíntese?", options: ["Fungos", "Algas", "Leões", "Leveduras"], answer: 1, explanation: "Plantas, algas e algumas bactérias fazem fotossíntese." },
    { question: "Para que serve a glicose produzida pela planta?", options: ["Só para dar cor às folhas", "Como fonte de energia ou reserva (amido)", "Para absorver luz", "Para produzir clorofila a partir de luz verde"], answer: 1, explanation: "A glicose é usada como energia ou armazenada como amido." }
  ]
};

// ---------------------------------------------------------------------------
// Utilitários
// ---------------------------------------------------------------------------
function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c);
  return node;
}
function save() {
  if (course?.generator === "exemplo") return;  // o exemplo nunca substitui o documento guardado
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ course, results })); } catch (_) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data?.course?.sections?.length) return false;
    course = data.course; results = data.results || {};
    return true;
  } catch (_) { return false; }
}
function pct(r) { return r.total ? Math.round(100 * r.correct / r.total) : 0; }
function pill(r) {
  if (!r) return null;
  return el("span", { class: "pill " + (pct(r) >= 70 ? "good" : pct(r) < 50 ? "bad" : "") }, `${r.correct}/${r.total}`);
}
const ERROR_COPY = {
  not_granted: "Não deste permissão para esta página usar o Claude. Podes continuar no modo local.",
  sampling_disabled: "O Claude não está disponível para esta conta. Podes continuar no modo local.",
  rate_limited: "Atingiste o limite de utilização do Claude. Tenta mais tarde ou usa o modo local.",
  session_expired: "A sessão expirou. Volta a iniciar sessão no claude.ai e tenta de novo.",
  prompt_too_large: "O documento é demasiado grande para um pedido. Experimenta um PDF mais curto.",
  refused: "O Claude recusou processar este conteúdo.",
  invalid_json: "A resposta do Claude veio num formato inesperado. Tenta outra vez.",
  upstream_error: "Falha temporária de ligação ao Claude. Tenta outra vez."
};

// ---------------------------------------------------------------------------
// Leitura do PDF (pdf.js no próprio browser)
// ---------------------------------------------------------------------------
async function readPdf(file) {
  const data = new Uint8Array(await file.arrayBuffer());
  const pdf = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    let text = "", lastY = null;
    for (const item of content.items) {
      const y = item.transform ? item.transform[5] : lastY;
      if (lastY !== null && Math.abs(y - lastY) > 2) text += "\n";
      text += item.str;
      if (item.hasEOL) text += "\n";
      lastY = y;
    }
    pages.push(cleanText(text));
  }
  let title = "";
  try { title = ((await pdf.getMetadata()).info?.Title || "").trim(); } catch (_) {}
  if (!pages.some(p => p.trim())) throw new Error("O PDF não tem texto que se possa extrair (pode ser um documento digitalizado).");
  return { title: title || firstLine(pages) || file.name.replace(/\.pdf$/i, ""), pages };
}
function cleanText(t) {
  return t.replace(/\r/g, "")
    .replace(/-\n(\p{L})/gu, "$1")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/([^.!?:;\n])\n(?!\n)(?=[\p{Ll}0-9(])/gu, "$1 ")
    .trim();
}
function firstLine(pages) {
  for (const p of pages) for (const l of p.split("\n")) { const s = l.trim(); if (s.length >= 3 && s.length <= 120) return s; }
  return "";
}
function splitSections(pages) {
  const paras = pages.flatMap(p => p.split(/\n\s*\n/)).map(p => p.trim()).filter(p => p.length > 1);
  const total = paras.reduce((n, p) => n + p.length, 0);
  const n = Math.max(1, Math.min(MAX_SECTIONS, Math.round(total / TARGET_SECTION_CHARS)));
  const target = total / n;
  const chunks = [[]]; let size = 0;
  for (const p of paras) {
    if (size >= target && chunks.length < n) { chunks.push([]); size = 0; }
    chunks.at(-1).push(p); size += p.length;
  }
  return chunks.map((c, i) => {
    const first = (c[0] || "").split("\n")[0].trim();
    const heading = first.length >= 3 && first.length <= 80 && !/[.,;]$/.test(first) ? first : null;
    return { title: heading || `Parte ${i + 1}`, text: c.join("\n\n") };
  });
}

// ---------------------------------------------------------------------------
// Geração com o Claude
// ---------------------------------------------------------------------------
const QUESTION_FORMAT = `{"question": string, "options": [4 strings], "answer": índice 0-3 da opção correta, "explanation": string}`;

function sectionPrompt(title, parts) {
  return `És um tutor que transforma documentos em material de estudo rápido.

Abaixo estão partes do documento "${title}". Para CADA parte, pela ordem, cria:
- "title": um título curto e descritivo;
- "summary": um resumo claro com as ideias essenciais (1 a 3 parágrafos separados por \\n);
- "key_points": 3 a 6 pontos-chave curtos;
- "questions": ${QUESTIONS_PER_SECTION} perguntas de escolha múltipla sobre essa parte.

Cada pergunta: ${QUESTION_FORMAT}. Exatamente 4 opções plausíveis, uma única correta, varia a posição da resposta certa, explicação breve com base no texto. Testa compreensão, não só memorização literal.

Usa apenas informação do documento. Escreve na língua do documento; se não for clara, usa português de Portugal.

Responde só com JSON: {"sections": [{"part": número, "title": ..., "summary": ..., "key_points": [...], "questions": [...]}]}

${parts.map(p => `<parte numero="${p.n}">\n${p.text}\n</parte>`).join("\n\n")}`;
}

function finalPrompt(c) {
  const outline = c.sections.map((s, i) =>
    `Secção ${i + 1}: ${s.title}\nResumo: ${s.summary}\nPontos-chave: ${s.key_points.join("; ")}\nPerguntas já feitas: ${s.questions.map(q => q.question).join(" | ")}`
  ).join("\n\n");
  return `És um tutor. Com base no resumo do documento "${c.title}" abaixo, cria um teste final com ${FINAL_TEST_SIZE} perguntas de escolha múltipla que cubra TODOS os assuntos, repartidas pelas secções. Não repitas as perguntas já feitas; privilegia perguntas que relacionem ideias de secções diferentes.

Cada pergunta: ${QUESTION_FORMAT}. Exatamente 4 opções plausíveis, uma única correta, varia a posição da resposta certa.

Escreve na língua do documento. Responde só com JSON: {"final_test": [...]}

${outline}`;
}

function validQuestion(q) {
  return q && typeof q.question === "string" && Array.isArray(q.options) && q.options.length >= 2 &&
    Number.isInteger(q.answer) && q.answer >= 0 && q.answer < q.options.length;
}
function cleanQuestion(q) {
  return { question: String(q.question), options: q.options.map(String), answer: q.answer, explanation: String(q.explanation || "") };
}

function batches(sections) {
  const out = []; let cur = []; let size = 0;
  sections.forEach((s, i) => {
    const text = s.text.slice(0, MAX_SECTION_CHARS);
    if (cur.length && size + text.length > BATCH_CHARS) { out.push(cur); cur = []; size = 0; }
    cur.push({ n: i + 1, text }); size += text.length;
  });
  if (cur.length) out.push(cur);
  return out;
}

async function generateWithClaude(title, sections, log, signal) {
  const groups = batches(sections);
  const result = { title, generator: "claude", sections: [], final_test: [] };
  for (let g = 0; g < groups.length; g++) {
    const parts = groups[g];
    const label = parts.length === 1 ? `Parte ${parts[0].n}` : `Partes ${parts[0].n}–${parts.at(-1).n}`;
    const step = log(`A resumir e criar perguntas: ${label} de ${sections.length}`);
    const data = await sample.json(sectionPrompt(title, parts), { signal, modelTier: "default" });
    const got = Array.isArray(data?.sections) ? data.sections : [];
    parts.forEach((p, k) => {
      const s = got.find(x => Number(x?.part) === p.n) || got[k] || {};
      result.sections.push({
        title: String(s.title || sections[p.n - 1].title),
        summary: String(s.summary || ""),
        key_points: Array.isArray(s.key_points) ? s.key_points.map(String) : [],
        questions: (Array.isArray(s.questions) ? s.questions : []).filter(validQuestion).map(cleanQuestion)
      });
    });
    step.done();
  }
  const step = log("A preparar o teste final sobre todo o documento");
  const data = await sample.json(finalPrompt(result), { signal, modelTier: "default" });
  result.final_test = (Array.isArray(data?.final_test) ? data.final_test : []).filter(validQuestion).map(cleanQuestion);
  step.done();
  if (!result.sections.some(s => s.summary)) throw { code: "invalid_json" };
  return result;
}

// ---------------------------------------------------------------------------
// Gerador local (sem Claude): resumo extrativo e perguntas de completar
// ---------------------------------------------------------------------------
const STOP = new Set(("a à às ao aos as o os um uma uns umas de do da dos das no na nos nas em por para pelo pela pelos pelas com sem sob sobre entre até após e ou mas nem que se como quando onde qual quais quem porque pois também já ainda muito muita muitos muitas mais menos tão tanto tal tais este esta estes estas esse essa esses essas aquele aquela aqueles aquelas isto isso aquilo ele ela eles elas eu tu nós você vocês seu sua seus suas meu minha nosso nossa lhe lhes me te nos não sim ser é são foi foram era eram será serão sendo sido estar está estão estava ter tem têm tinha haver há havia pode podem deve devem fazer faz fazem cada todo toda todos todas outro outra outros outras mesmo mesma só apenas assim então " +
  "the of and to in is are was were be been for on with as by at from that this these those it its or an not but which who what when where how can could will would should may might must has have had do does did than then there their they them also such into about more most other some any each all both only over under between after before during").split(" "));
const WORD = /[\p{L}][\p{L}\-]+/gu;

function terms(text) {
  const f = new Map();
  for (const w of text.match(WORD) || []) {
    const k = w.toLowerCase();
    if (k.length > 2 && !STOP.has(k)) f.set(k, (f.get(k) || 0) + 1);
  }
  return f;
}
function sentences(text) {
  const lines = text.split("\n").filter(l => /[.!?:;]\s*$/.test(l) || l.split(/\s+/).length > 8);
  const parts = lines.join(" ").replace(/\s+/g, " ").split(/(?<=[.!?])\s+(?=[\p{Lu}0-9"«(])/u);
  const seen = []; const out = [];
  for (const p0 of parts) {
    const p = p0.trim(); const key = p.toLowerCase().replace(/[.!?]+$/, "");
    if (p.length > 20 && !seen.some(s => s.startsWith(key) || key.startsWith(s))) { seen.push(key); out.push(p); }
  }
  return out;
}
function score(s, f) {
  const ws = (s.match(WORD) || []).map(w => w.toLowerCase());
  return ws.length ? ws.reduce((n, w) => n + (f.get(w) || 0), 0) / Math.pow(ws.length, .6) : 0;
}
function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }; }
function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function generateLocal(title, sections) {
  const rnd = rng(42);
  const vocab = [...terms(sections.map(s => s.text).join("\n")).entries()].sort((a, b) => b[1] - a[1]).slice(0, 300).map(e => e[0]);
  const pool = [];
  const out = sections.map(sec => {
    const sents = sentences(sec.text);
    const f = terms(sec.text);
    const ranked = [...sents].sort((a, b) => score(b, f) - score(a, f));
    const top = new Set(ranked.slice(0, 4));
    const used = new Set(); const qs = [];
    for (const s of ranked) {
      if (qs.length >= QUESTIONS_PER_SECTION * 2) break;
      if (s.length < 40 || s.length > 400) continue;
      const cands = (s.match(WORD) || []).filter(w => f.has(w.toLowerCase()) && !used.has(w.toLowerCase()) && w.length > 4);
      if (!cands.length) continue;
      const term = cands.reduce((a, b) => (f.get(b.toLowerCase()) > f.get(a.toLowerCase()) ? b : a));
      const inS = new Set((s.match(WORD) || []).map(w => w.toLowerCase()));
      const d = shuffle(vocab.filter(w => w !== term.toLowerCase() && !inS.has(w) && w.length > 3)
        .sort((a, b) => Math.abs(a.length - term.length) - Math.abs(b.length - term.length)).slice(0, 12), rnd).slice(0, 3);
      if (d.length < 3) continue;
      used.add(term.toLowerCase());
      const opts = shuffle([...d, term.toLowerCase()], rnd);
      qs.push({
        question: `Complete a frase: «${s.replace(new RegExp(`(^|[^\\p{L}])${escapeRe(term)}(?![\\p{L}])`, "u"), "$1_____")}»`,
        options: opts, answer: opts.indexOf(term.toLowerCase()), explanation: `No documento: «${s}»`
      });
    }
    pool.push(...qs.slice(QUESTIONS_PER_SECTION));
    return {
      title: sec.title,
      summary: sents.filter(s => top.has(s)).join(" ") || sec.text.slice(0, 600),
      key_points: [...f.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(e => e[0][0].toUpperCase() + e[0].slice(1)),
      questions: qs.slice(0, QUESTIONS_PER_SECTION)
    };
  });
  if (pool.length < FINAL_TEST_SIZE) out.forEach(s => pool.push(...s.questions));
  return { title, generator: "local", sections: out, final_test: shuffle(pool, rnd).slice(0, FINAL_TEST_SIZE) };
}

let view = "home";
function show(nodes, name) {
  view = name;
  app.replaceChildren(...[].concat(nodes));

function renderHome(error) {
  const hasClaude = !!sample;
  const fileInput = el("input", { type: "file", id: "pdf-input", accept: "application/pdf,.pdf" });
  const drop = el("label", { class: "drop", for: "pdf-input" },
    fileInput,
    el("strong", {}, "Escolhe ou arrasta um PDF"),
    el("span", { class: "muted" }, "O ficheiro é lido no teu browser.")
  );
  const useLocal = el("input", { type: "radio", name: "mode", id: "mode-local", value: "local", checked: !hasClaude });
  const useClaude = el("input", { type: "radio", name: "mode", id: "mode-claude", value: "claude", checked: hasClaude, disabled: !hasClaude });
  const start = file => {
    if (!file) return;
    if (!/\.pdf$/i.test(file.name) && file.type !== "application/pdf") return renderHome("O ficheiro tem de ser um PDF.");
    process(file, useClaude.checked && hasClaude);
  };
  fileInput.addEventListener("change", () => start(fileInput.files[0]));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); start(e.dataTransfer.files[0]); });

  const resume = load() && course.generator !== "exemplo"
    ? el("div", { class: "notice row split" },
        el("span", {}, "Último documento: ", el("b", {}, course.title)),
        el("button", { class: "btn", type: "button", onclick: renderOverview }, "Continuar"))
    : null;

  show([
    el("section", { class: "sheet" },
      el("h1", {}, "Estuda um PDF em minutos"),
      el("p", {}, "Envia um documento. Cada secção fica com um resumo e pontos-chave, perguntas de escolha múltipla para fazeres logo a seguir à leitura e, no fim, um teste sobre todos os assuntos."),
      el("div", { class: "steps" },
        el("div", {}, el("b", {}, "Resumo"), "Ideias essenciais e pontos-chave por secção."),
        el("div", {}, el("b", {}, "Perguntas"), `${QUESTIONS_PER_SECTION} perguntas após cada leitura, com correção.`),
        el("div", {}, el("b", {}, "Teste final"), `${FINAL_TEST_SIZE} perguntas sobre todo o documento.`)
      ),
      error ? el("p", { class: "notice error", role: "alert" }, error) : null,
      drop,
      el("div", { class: "mode" },
        el("label", { for: "mode-claude" }, useClaude, el("span", {}, el("b", {}, "Com o Claude"), " — resumos e perguntas de compreensão, gerados com a tua conta Claude.",
          hasClaude ? null : el("span", { class: "muted" }, " (Indisponível nesta vista.)"))),
        el("label", { for: "mode-local" }, useLocal, el("span", {}, el("b", {}, "Modo local"), " — instantâneo e sem IA: resumo com as frases principais e perguntas de completar frases."))
      )
    ),
    resume,
    el("section", { class: "sheet" },
      el("div", { class: "row split" },
        el("div", {}, el("p", { class: "tag" }, "Exemplo"), el("h2", {}, EXAMPLE.title)),
        el("button", { class: "btn", type: "button", onclick: () => { course = structuredClone(EXAMPLE); results = {}; renderOverview(); } }, "Abrir o exemplo")
      ),
      el("p", { class: "muted" }, "Um curso curto de biologia, para veres como fica antes de enviares o teu PDF.")
    )
  ], "home");
}

function renderProcessing(fileName) {
  const list = el("ul", { class: "log" });
  running = new AbortController();
  const ctl = running;
  show(el("section", { class: "sheet", "aria-live": "polite" },
    el("h2", {}, "A preparar o material de estudo"),
    el("p", { class: "muted mono" }, fileName),
    list,
    el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: () => { ctl.abort(); renderHome(); } }, "Cancelar"))
  ), "processing");
  const log = text => {
    const li = el("li", { class: "run" }, el("span", { class: "st" }, "●"), el("span", {}, text));
    list.append(li);
    return {
      done() { li.className = "done"; li.firstChild.textContent = "✓"; },
      fail() { li.className = "err"; li.firstChild.textContent = "✕"; }
    };
  };
  return { log, signal: ctl.signal };
}

async function process(file, withClaude) {
  const { log, signal } = renderProcessing(file.name);
  let step = log("A ler o PDF");
  let doc, sections;
  try {
    doc = await readPdf(file);
    sections = splitSections(doc.pages);
    step.done();
    log(`${doc.pages.length} páginas, ${sections.length} secções`).done();
  } catch (e) {
    step.fail();
    return renderHome(e?.message?.startsWith("O PDF") ? e.message : "Não foi possível ler este PDF. Confirma que o ficheiro não está danificado nem protegido por palavra-passe.");
  }
  let result;
  if (withClaude) {
    try {
      result = await generateWithClaude(doc.title, sections, log, signal);
    } catch (e) {
      if (e?.code === "cancelled" || signal.aborted) return;
      const msg = ERROR_COPY[e?.code] || ERROR_COPY.upstream_error;
      log(msg).fail();
      list_fallback(log, msg, () => finish(generateLocal(doc.title, sections), file.name), () => process(file, true));
      return;
    }
  } else {
    step = log("A gerar resumos e perguntas (modo local)");
    result = generateLocal(doc.title, sections);
    step.done();
  }
  if (!signal.aborted) finish(result, file.name);
}
function list_fallback(log, msg, onLocal, onRetry) {
  const sheet = app.querySelector(".sheet");
  sheet.lastChild.replaceWith(el("div", { class: "row" },
    el("button", { class: "btn primary", type: "button", onclick: onRetry }, "Tentar outra vez"),
    el("button", { class: "btn", type: "button", onclick: onLocal }, "Continuar no modo local"),
    el("button", { class: "btn", type: "button", onclick: () => renderHome() }, "Voltar")
  ));
}
function finish(result, filename) {
  course = { ...result, filename };
  results = {};
  save();
  renderOverview();
}

function renderOverview() {
  const done = course.sections.filter((_, i) => results[i]).length;
  show(el("section", { class: "sheet" },
    el("div", {},
      el("p", { class: "tag" }, course.generator === "claude" ? "Gerado com o Claude" : course.generator === "local" ? "Gerado em modo local" : "Exemplo"),
      el("h1", {}, course.title)),
    el("p", { class: "muted mono" }, `${course.sections.length} secções · ${done} concluídas · teste final: ${course.final_test.length} perguntas`),
    el("ol", { class: "toc" },
      course.sections.map((s, i) => el("li", {},
        el("button", { type: "button", onclick: () => renderSection(i) },
          el("span", { class: "n" }, String(i + 1).padStart(2, "0")), el("span", { class: "t" }, s.title), pill(results[i]) || el("span"))
      )),
      el("li", {}, el("button", { type: "button", onclick: renderFinal },
        el("span", { class: "n" }, "✎"), el("span", { class: "t" }, "Teste final"), pill(results.final) || el("span")))
    ),
    el("div", { class: "row" },
      el("button", { class: "btn primary", type: "button", onclick: () => renderSection(Math.min(done, course.sections.length - 1)) }, done ? "Continuar a estudar" : "Começar a estudar"),
      el("button", { class: "btn", type: "button", onclick: renderFinal }, "Ir para o teste final"))
  ), "overview");
  if (course.generator !== "exemplo") app.append(exportBlock());
}

// Copia o curso para colar na página de estudo partilhável.
function exportBlock() {
  const json = JSON.stringify({ speedlearning: 1, course: { ...course } });
  const area = el("textarea", { id: "export-json", readonly: true, rows: 4, class: "mono", hidden: true });
  area.value = json;
  const status = el("span", { class: "muted", role: "status" });
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(json);
      status.textContent = "Copiado. Cola-o na página de estudo, em «Substituir conteúdo».";
    } catch (_) {
      area.hidden = false; area.focus(); area.select();
      status.textContent = "Copia o texto selecionado (Ctrl+C / ⌘C).";
    }
  };
  return el("section", { class: "sheet" },
    el("h2", {}, "Partilhar como página de estudo"),
    el("p", { class: "muted" }, "Copia este curso e cola-o na tua página de estudo SpeedLearning. Quem tiver o link estuda e faz os testes sem precisar de conta."),
    el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: copy }, "Copiar curso"), status),
    area);
}

function quiz(questions, key, onGraded) {
  const prev = results[key];
  const form = el("form", { class: prev ? "graded" : "" });
  questions.forEach((q, qi) => {
    const a = prev?.answers[qi];
    form.append(el("fieldset", { class: "q" },
      el("legend", {}, el("span", { class: "mono" }, `${qi + 1}.`), el("span", {}, q.question)),
      q.options.map((opt, oi) => {
        const cls = prev ? (oi === q.answer ? "opt correct" : a === oi ? "opt wrong" : "opt") : "opt";
        return el("label", { class: cls },
          el("input", { type: "radio", name: `${key}-q${qi}`, id: `${key}-q${qi}-${oi}`, value: oi, checked: a === oi, disabled: !!prev }),
          el("span", { class: "bubble", "aria-hidden": "true" }, "ABCDEFGH"[oi]),
          el("span", {}, opt));
      }),
      prev ? el("p", { class: "why" }, a === q.answer ? el("b", { class: "ok" }, "Certo. ") : el("b", { class: "no" }, a == null ? "Sem resposta. " : "Errado. "), q.explanation) : null
    ));
  });
  if (!prev) {
    const missing = el("p", { class: "muted", hidden: true }, "Responde a todas as perguntas antes de verificar.");
    form.append(missing, el("div", { class: "row" }, el("button", { class: "btn primary", type: "submit" }, key === "final" ? "Entregar teste" : "Verificar respostas")));
    form.addEventListener("submit", e => {
      e.preventDefault();
      const answers = questions.map((_, qi) => {
        const c = form.querySelector(`input[name="${key}-q${qi}"]:checked`);
        return c ? Number(c.value) : null;
      });
      if (answers.includes(null)) { missing.hidden = false; return; }
      results[key] = { answers, correct: answers.filter((a, i) => a === questions[i].answer).length, total: questions.length };
      save();
      onGraded();
    });
  }
  return form;
}
function scoreBlock(r, final) {
  const p = pct(r);
  const msg = final
    ? p >= 70 ? "Excelente. Dominas os conteúdos deste documento." : p >= 50 ? "Bom trabalho. Revê as secções onde erraste." : "Revê os resumos e tenta outra vez."
    : p >= 70 ? "Muito bem." : "Relê o resumo antes de avançar.";
  return el("div", { class: "score" }, el("span", { class: "big" }, `${r.correct}/${r.total}`), el("span", { class: "muted" }, `${p}% · ${msg}`));
}

function renderSection(i) {
  const s = course.sections[i];
  const n = course.sections.length;
  const r = results[i];
  show([
    el("div", { class: "row split" },
      el("button", { class: "btn", type: "button", onclick: renderOverview }, "← Índice"),
      el("span", { class: "mono muted" }, `Secção ${i + 1} de ${n}`)),
    el("div", { class: "bar", role: "progressbar", "aria-valuemin": 0, "aria-valuemax": n, "aria-valuenow": i + 1 }, el("div", { style: `width:${(i + 1) / n * 100}%` })),
    el("article", { class: "sheet" },
      el("h1", {}, s.title),
      el("h3", {}, "Resumo"),
      el("div", { class: "summary" }, s.summary.split("\n").filter(x => x.trim()).map(x => el("p", {}, x))),
      s.key_points.length ? [el("h3", {}, "Pontos-chave"), el("ul", { class: "keys" }, s.key_points.map(k => el("li", {}, el("span", {}, k))))] : null
    ),
    el("section", { class: "sheet", id: "quiz" },
      el("h2", {}, "Avalia o que leste"),
      r ? scoreBlock(r, false) : null,
      s.questions.length ? quiz(s.questions, String(i), () => renderSection(i)) : el("p", { class: "muted" }, "Não há perguntas para esta secção."),
      r ? el("div", { class: "row" }, el("button", { class: "btn", type: "button", onclick: () => { delete results[i]; save(); renderSection(i); } }, "Repetir perguntas")) : null
    ),
    el("div", { class: "row split" },
      i > 0 ? el("button", { class: "btn", type: "button", onclick: () => renderSection(i - 1) }, "← Anterior") : el("span"),
      i + 1 < n
        ? el("button", { class: "btn primary", type: "button", onclick: () => renderSection(i + 1) }, "Próxima secção →")
        : el("button", { class: "btn primary", type: "button", onclick: renderFinal }, "Fazer o teste final →"))
  ], "section");
  if (r) document.getElementById("quiz").scrollIntoView();
}

function renderFinal() {
  const r = results.final;
  show([
    el("div", { class: "row split" },
      el("button", { class: "btn", type: "button", onclick: renderOverview }, "← Índice"),
      el("span", { class: "mono muted" }, `${course.final_test.length} perguntas`)),
    el("section", { class: "sheet" },
      el("div", {}, el("p", { class: "tag" }, "Teste final"), el("h1", {}, course.title)),
      el("p", { class: "muted" }, "Perguntas sobre todos os assuntos do documento."),
      r ? scoreBlock(r, true) : null,
      course.final_test.length ? quiz(course.final_test, "final", renderFinal) : el("p", { class: "muted" }, "Não foi possível gerar perguntas para o teste final."),
      r ? el("div", { class: "row" },
        el("button", { class: "btn primary", type: "button", onclick: () => { delete results.final; save(); renderFinal(); } }, "Repetir teste"),
        el("button", { class: "btn", type: "button", onclick: () => renderHome() }, "Novo PDF")) : null
    )
  ], "final");
}
